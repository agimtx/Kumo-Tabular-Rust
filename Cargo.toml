[package]
name = "tabular-onnx"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Extensible table preprocessing and ONNX inference for tabular models"
license = "MIT"

[dependencies]
ndarray = "0.16"
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "load-dynamic"] }
polars = { version = "0.46", default-features = false, features = ["dtype-categorical", "dtype-date", "dtype-datetime", "strings"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lib]
path = "src/lib.rs"
