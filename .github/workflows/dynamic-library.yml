name: Build dynamic libraries

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        required: true
        default: all
        type: choice
        options:
          - all
          - x86_64
          - aarch64

env:
  # Pinned runtime bundled into every bundle. ONNX Runtime keeps older C API
  # versions, so 1.23.0 remains compatible with the `ort` crate's API level.
  ORT_VERSION: "1.23.0"

permissions:
  contents: read

jobs:
  # Resolve the `arch` choice into concrete build targets. A workflow matrix
  # cannot be filtered by an expression, so the selection happens here and the
  # build job consumes the result through `fromJSON`.
  prepare:
    name: Select targets for ${{ inputs.arch }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Filter build targets by architecture
        id: matrix
        shell: bash
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          targets = [
              {
                  "runner": "ubuntu-latest",
                  "platform": "linux",
                  "arch": "x86_64",
                  "rust-target": "x86_64-unknown-linux-gnu",
                  "library": "libtabular_onnx.so",
              },
              {
                  "runner": "windows-latest",
                  "platform": "windows",
                  "arch": "x86_64",
                  "rust-target": "x86_64-pc-windows-msvc",
                  "library": "tabular_onnx.dll",
              },
              {
                  "runner": "macos-latest",
                  "platform": "macos",
                  "arch": "aarch64",
                  "rust-target": "aarch64-apple-darwin",
                  "library": "libtabular_onnx.dylib",
              },
          ]

          arch = os.environ["ARCH"]
          selected = [target for target in targets if arch in ("all", target["arch"])]
          if not selected:
              raise SystemExit(f"no build targets for arch {arch}")
          print("matrix=" + json.dumps({"include": selected}))
          PY

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Build dynamic library
        run: cargo build --release --lib --target ${{ matrix.rust-target }}
      - name: Fetch ONNX Runtime
        shell: bash
        run: |
          ROOT=$(python scripts/fetch_onnxruntime.py \
            --version "$ORT_VERSION" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --output "$RUNNER_TEMP/onnxruntime")
          # Keep a single real library under the canonical name; drop the
          # unversioned symlink shipped in the release archive.
          case "${{ matrix.platform }}" in
            macos)
              target="$ROOT/lib/libonnxruntime.dylib"
              source=$(ls "$ROOT/lib"/libonnxruntime.*.dylib)
              ;;
            linux)
              target="$ROOT/lib/libonnxruntime.so"
              source=$(ls "$ROOT/lib"/libonnxruntime.so.*)
              ;;
            windows)
              target="$ROOT/lib/onnxruntime.dll"
              source="$target"
              ;;
          esac
          if [ "$source" != "$target" ]; then
            rm -f "$target"
            mv "$source" "$target"
          fi
          ls -l "$ROOT/lib"
          echo "ORT_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Package library, header, and ONNX Runtime
        shell: bash
        run: >-
          python scripts/package_dynamic_lib.py
          --source target/${{ matrix.rust-target }}/release/${{ matrix.library }}
          --header include/onnx_ffi.h
          --output runtime-lib
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --onnxruntime-dir "$ORT_ROOT/lib"
          --onnxruntime-version "$ORT_VERSION"
          --onnxruntime-license "$ORT_ROOT/LICENSE"
      - name: Verify bundle contents
        shell: bash
        run: |
          package="runtime-lib/libonnx-${{ matrix.platform }}-${{ matrix.arch }}"
          ls -l "$package" "$package/lib"
          test -f "$package/include/onnx_ffi.h"
          test -f "$package/ONNXRUNTIME_LICENSE"
          shopt -s nullglob
          libraries=("$package/lib"/libkumo-onnx-*)
          runtimes=("$package/lib"/*onnxruntime*)
          test "${#libraries[@]}" -eq 1
          test "${#runtimes[@]}" -eq 1
      - name: Smoke test bundled ONNX Runtime
        shell: bash
        run: >-
          python scripts/smoke_dynamic_lib.py
          --package "runtime-lib/libonnx-${{ matrix.platform }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: libonnx-${{ matrix.platform }}-${{ matrix.arch }}
          path: runtime-lib/libonnx-${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
