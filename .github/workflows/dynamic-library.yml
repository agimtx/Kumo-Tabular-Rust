name: Build dynamic libraries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x86_64
            rust-target: x86_64-unknown-linux-gnu
            library: libtabular_onnx.so
          - runner: windows-latest
            platform: windows
            arch: x86_64
            rust-target: x86_64-pc-windows-msvc
            library: tabular_onnx.dll
          - runner: macos-latest
            platform: macos
            arch: aarch64
            rust-target: aarch64-apple-darwin
            library: libtabular_onnx.dylib
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Build dynamic library
        run: cargo build --release --lib --target ${{ matrix.rust-target }}
      - name: Package library and header
        shell: bash
        run: >-
          python scripts/package_dynamic_lib.py
          --source target/${{ matrix.rust-target }}/release/${{ matrix.library }}
          --header include/onnx_ffi.h
          --output runtime-lib
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: libonnx-${{ matrix.platform }}-${{ matrix.arch }}
          path: runtime-lib/libonnx-${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
