name: Export Kumo Tabular ONNX

on:
  workflow_dispatch:
    inputs:
      size:
        description: Model size
        required: true
        default: small
        type: choice
        options:
          - small
          - medium
          - large
      task:
        description: Model task
        required: true
        default: classification
        type: choice
        options:
          - classification
          - regression

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exporter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'structured-data-models==0.2.1' onnx
      - name: Download checkpoint
        env:
          SIZE: ${{ inputs.size }}
          TASK: ${{ inputs.task }}
        run: |
          if [ "$TASK" = classification ]; then file=classifier.pt; else file=regressor.pt; fi
          mkdir -p checkpoints
          curl --fail --location --retry 3 \
            "https://huggingface.co/nvidia/Kumo-Tabular/resolve/main/${SIZE}/${file}?download=true" \
            --output "checkpoints/${file}"
      - name: Convert to ONNX
        env:
          SIZE: ${{ inputs.size }}
          TASK: ${{ inputs.task }}
        run: |
          if [ "$TASK" = classification ]; then file=classifier.pt; else file=regressor.pt; fi
          python scripts/export_onnx.py \
            --size "$SIZE" --task "$TASK" \
            --checkpoint "checkpoints/${file}" \
            --output "output/kumo-tabular-${SIZE}-${TASK}-fp16.onnx"
      - uses: actions/upload-artifact@v4
        with:
          name: kumo-tabular-${{ inputs.size }}-${{ inputs.task }}-fp16-onnx
          path: output/
          if-no-files-found: error
          compression-level: 0
