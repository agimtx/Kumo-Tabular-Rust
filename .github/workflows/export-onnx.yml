name: Export Kumo Tabular ONNX

on:
  workflow_dispatch:
    inputs:
      size:
        description: Model size
        required: true
        default: small
        type: choice
        options:
          - small
          - medium
          - large
      task:
        description: Model task
        required: true
        default: classification
        type: choice
        options:
          - classification
          - regression
      quantization:
        description: Weight storage precision
        required: true
        default: fp32
        type: choice
        options:
          - fp32
          - fp16
          - fp8
          - int4
          - all

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exporter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'structured-data-models==0.2.1' onnx ml_dtypes
      - name: Download checkpoint
        env:
          SIZE: ${{ inputs.size }}
          TASK: ${{ inputs.task }}
        run: |
          if [ "$TASK" = classification ]; then file=classifier.pt; else file=regressor.pt; fi
          mkdir -p checkpoints
          curl --fail --location --retry 3 \
            "https://huggingface.co/nvidia/Kumo-Tabular/resolve/v1.0.1/${SIZE}/${file}?download=true" \
            --output "checkpoints/${file}"
      - name: Convert to ONNX
        env:
          SIZE: ${{ inputs.size }}
          TASK: ${{ inputs.task }}
          QUANTIZATION: ${{ inputs.quantization }}
        run: |
          if [ "$TASK" = classification ]; then file=classifier.pt; else file=regressor.pt; fi
          mkdir -p output
          if [ "$QUANTIZATION" = all ]; then quantizations="fp32 fp16 fp8 int4"; else quantizations="$QUANTIZATION"; fi
          for quantization in $quantizations; do
            python scripts/export_onnx.py \
              --size "$SIZE" --task "$TASK" --quantization "$quantization" \
              --checkpoint "checkpoints/${file}" \
              --output output
          done
      - name: Validate dynamic input shapes with ONNX Runtime
        env:
          SIZE: ${{ inputs.size }}
          TASK: ${{ inputs.task }}
          QUANTIZATION: ${{ inputs.quantization }}
        run: |
          python -m pip install onnxruntime numpy
          if [ "$QUANTIZATION" = all ]; then quantizations="fp32 fp16 fp8 int4"; else quantizations="$QUANTIZATION"; fi
          if [ "$TASK" = classification ]; then task_name=cls; else task_name=reg; fi
          for quantization in $quantizations; do
            case "$quantization" in
              fp32) precision=f32 ;;
              fp16) precision=f16 ;;
              fp8) precision=f8 ;;
              int4) precision=i4 ;;
            esac
            python scripts/validate_dynamic_onnx.py \
              "output/tabular-${task_name}-${SIZE}-${precision}.onnx" --task "$TASK"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tabular-${{ inputs.task }}-${{ inputs.size }}-${{ inputs.quantization }}-onnx
          path: output/
          if-no-files-found: error
          compression-level: 0
